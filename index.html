<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reader Helper</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f4f4f4; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #1f2937; color: #fff; padding: 24px 16px; }
    .sidebar h1 { font-size: 20px; margin: 0 0 24px; }
    .menu { list-style: none; padding: 0; margin: 0; }
    .menu li { margin-bottom: 12px; }
    .menu button { width: 100%; text-align: left; padding: 12px 14px; color: #fff; background: transparent; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .menu button.active, .menu button:hover { background: #374151; }
    .content { padding: 24px; }
    .section { display: none; }
    .section.active { display: block; }
    .panel { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .panel h2 { margin-top: 0; }
    .field { margin-bottom: 14px; }
    .help-text { margin: 4px 0 14px; font-size: 12px; color: #6b7280; }
    input, textarea, select, button { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    textarea { resize: vertical; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; }
    button:hover { background: #1d4ed8; }
    .grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    table { width: 100%; border-collapse: collapse; }
    table th, table td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
    table th { background: #f8fafc; }
    .actions button { margin-right: 8px; width: auto; }
    .book-count { font-size: 13px; font-weight: 400; color: #6b7280; margin-left: 8px; }
    .book-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    .book-card { display: flex; gap: 14px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; background: #fff; transition: box-shadow .2s ease, transform .2s ease; }
    .book-card:hover { box-shadow: 0 10px 28px rgba(15,23,42,.10); transform: translateY(-2px); }
    .book-cover { flex: 0 0 64px; width: 64px; height: 88px; border-radius: 8px; background: #f1f5f9; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover-placeholder { font-size: 24px; color: #94a3b8; }
    .book-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .book-title { font-weight: 600; font-size: 15px; color: #111827; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .book-meta { font-size: 12px; color: #6b7280; margin: 4px 0 8px; }
    .book-desc { font-size: 12px; color: #475569; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book-actions { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .book-actions button { width: auto; margin-right: 0; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .book-actions button.secondary { background: #e5e7eb; color: #111827; }
    .book-actions button.secondary:hover { background: #d1d5db; }
    .book-empty { padding: 40px 0; text-align: center; color: #6b7280; font-size: 14px; }
    .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { width: min(680px, 92vw); max-height: 86vh; background: #fff; border-radius: 16px; box-shadow: 0 24px 64px rgba(15,23,42,.25); display: flex; flex-direction: column; overflow: hidden; animation: modal-in .18s ease; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #e5e7eb; }
    .modal-header h3 { margin: 0; font-size: 17px; color: #111827; }
    .modal-close { width: 32px; height: 32px; padding: 0; border: none; background: transparent; color: #6b7280; font-size: 22px; line-height: 1; border-radius: 8px; }
    .modal-close:hover { background: #f3f4f6; color: #111827; }
    .modal-body { padding: 20px 24px; overflow-y: auto; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid #e5e7eb; background: #f8fafc; }
    .modal-footer button { width: auto; padding: 10px 22px; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .btn-secondary:hover { background: #d1d5db; }
    .field-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #374151; }
    .cover-edit { display: flex; gap: 12px; align-items: flex-start; }
    .cover-edit input { flex: 1; }
    .cover-preview { flex: 0 0 56px; width: 56px; height: 76px; border-radius: 8px; background: #f1f5f9; border: 1px solid #e5e7eb; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 20px; }
    .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
    .parse-header { padding: 16px 18px; border: 1px solid #e5e7eb; border-radius: 12px; background: #f8fafc; margin-bottom: 16px; }
    .parse-title { font-size: 18px; font-weight: 700; color: #111827; }
    .parse-meta { margin-top: 6px; font-size: 13px; color: #6b7280; }
    .parse-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .parse-toolbar input { flex: 1; }
    .parse-toolbar button { width: auto; padding: 10px 16px; white-space: nowrap; }
    .filter-status { flex: 0 0 auto; font-size: 12px; color: #6b7280; white-space: nowrap; }
    .chapter-list { display: flex; flex-direction: column; gap: 10px; }
    .chapter-item { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    .chapter-item.expanded { border-color: #bfdbfe; box-shadow: 0 6px 18px rgba(37,99,235,.10); }
    .chapter-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; }
    .chapter-head:hover { background: #f8fafc; }
    .chapter-no { flex: 0 0 auto; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .chapter-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chapter-toggle { flex: 0 0 auto; font-size: 12px; color: #2563eb; }
    .chapter-preview { padding: 0 14px 10px 54px; font-size: 12px; color: #9ca3af; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chapter-item.expanded .chapter-preview { display: none; }
    .chapter-body { display: none; padding: 14px 18px; border-top: 1px solid #e5e7eb; max-height: 420px; overflow-y: auto; font-size: 13px; line-height: 1.9; color: #374151; white-space: pre-wrap; word-break: break-word; }
    .parse-empty { padding: 40px 0; text-align: center; color: #6b7280; font-size: 14px; }
    .html-list a { display: block; margin-bottom: 10px; color: #2563eb; text-decoration: none; }
    .html-list a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Reader Helper</h1>
      <ul class="menu">
        <li><button class="menu-item active" data-target="upload-section">上传管理</button></li>
        <li><button class="menu-item" data-target="books-section">书籍列表</button></li>
        <li><button class="menu-item" data-target="rules-section">章节规则</button></li>
        <li><button class="menu-item" data-target="html-section">HTML 服务</button></li>
        <li><button class="menu-item" data-target="result-section">解析结果</button></li>
      </ul>
    </aside>

    <main class="content">
      <section id="upload-section" class="section active">
        <div class="panel">
          <h2>上传书籍</h2>
          <div class="field"><button id="select-file">选择 TXT 文件</button></div>
          <div class="grid-2">
            <div class="field"><input id="book-title" placeholder="书名" /></div>
            <div class="field"><input id="book-author" placeholder="作者" /></div>
          </div>
          <div class="field"><textarea id="book-desc" rows="3" placeholder="简介"></textarea></div>
          <div class="field"><input id="book-cover" placeholder="封面 URL（可选）" /></div>
          <div class="field"><textarea id="book-directory-entries" rows="5" placeholder="目录项（每行一条，换行分隔）"></textarea></div>
          <div class="help-text">输入目录名称，每行一条。解析时只要正文中出现这些内容，就会被识别为目录。</div>
          <div class="field"><button id="upload-book">上传并保存</button></div>
          <div class="field"><span id="upload-status"></span></div>
        </div>
      </section>

      <section id="books-section" class="section">
        <div class="panel">
          <h2>书籍列表<span id="book-count" class="book-count"></span></h2>
          <div id="book-list" class="book-grid"></div>
          <div id="book-empty" class="book-empty" style="display:none;">暂无书籍，请先在“上传管理”中添加。</div>
        </div>
      </section>

      <div id="edit-modal" class="modal-mask" style="display:none;">
        <div class="modal">
          <div class="modal-header">
            <h3>编辑书籍</h3>
            <button id="close-edit" class="modal-close" type="button" aria-label="关闭">×</button>
          </div>
          <div class="modal-body">
            <input id="edit-book-id" type="hidden" />
            <div class="grid-2">
              <div class="field"><label class="field-label" for="edit-book-title">书名</label><input id="edit-book-title" placeholder="请输入书名" /></div>
              <div class="field"><label class="field-label" for="edit-book-author">作者</label><input id="edit-book-author" placeholder="请输入作者" /></div>
            </div>
            <div class="field"><label class="field-label" for="edit-book-description">简介</label><textarea id="edit-book-description" rows="4" placeholder="请输入简介"></textarea></div>
            <div class="field">
              <label class="field-label" for="edit-book-cover">封面</label>
              <div class="cover-edit">
                <div class="cover-preview" id="edit-cover-preview"><span>📖</span></div>
                <input id="edit-book-cover" placeholder="封面 URL（可选）" />
              </div>
              <div class="help-text">支持 http(s) 图片地址，左侧实时预览。</div>
            </div>
            <div class="field">
              <label class="field-label" for="edit-book-directory">目录项</label>
              <textarea id="edit-book-directory" rows="5" placeholder="每行一条，换行分隔"></textarea>
              <div class="help-text">解析时只要正文中出现这些内容，就会被识别为目录。</div>
            </div>
          </div>
          <div class="modal-footer">
            <button id="cancel-edit" type="button" class="btn-secondary">取消</button>
            <button id="save-edit" type="button">保存</button>
          </div>
        </div>
      </div>

      <section id="rules-section" class="section">
        <div class="panel">
          <h2>解析规则</h2>
          <div class="field"><input id="rule-prefix" placeholder="章节前缀，例如：第" /></div>
          <div class="help-text">仅在标题检测中使用该前缀，例如“第”。</div>
          <div class="field"><input id="rule-keywords" placeholder="前缀后需包含的关键字，例如：章,回,节" /></div>
          <div class="help-text">以“第”开头的行还需包含这些关键字才会被识别为标题，多个关键字用逗号分隔。</div>
          <div class="field"><input id="rule-suffixes" placeholder="章节后缀，例如：章,回,节" /></div>
          <div class="help-text">多个后缀用逗号分隔，标题以这些后缀结尾时会被识别。</div>
          <div class="field"><input id="rule-max-title-length" placeholder="章节最大长度" type="number" /></div>
          <div class="help-text">超过该长度则不会判断为章节标题。</div>
          <div class="field"><label><input id="rule-empty-line" type="checkbox" /> 启用空行判断</label></div>
          <div class="field"><button id="save-rules">保存解析规则</button></div>
        </div>
      </section>

      <section id="html-section" class="section">
        <div class="panel">
          <h2>HTML 服务</h2>
          <div class="grid-2">
            <div class="field"><button id="start-server">启动 HTTP 服务</button></div>
            <div class="field"><button id="open-service-page">打开服务页面</button></div>
          </div>
          <div class="field"><div id="server-status" style="padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; background:#f9fafb; color:#111827;">服务未启动</div></div>
        </div>
      </section>

      <section id="result-section" class="section">
        <div class="panel">
          <h2>解析结果</h2>
          <div id="chapter-output">
            <div class="parse-empty">暂无解析结果，请在「书籍列表」中点击“解析章节”。</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let selectedFilePath = null;
    let lastServerUrl = null;
    const booksById = new Map();

    function switchSection(targetId) {
      document.querySelectorAll('.section').forEach((section) => {
        section.classList.toggle('active', section.id === targetId);
      });
      document.querySelectorAll('.menu-item').forEach((button) => {
        button.classList.toggle('active', button.dataset.target === targetId);
      });
    }

    document.querySelectorAll('.menu-item').forEach((button) => {
      button.addEventListener('click', () => switchSection(button.dataset.target));
    });

    document.getElementById('select-file').onclick = async () => {
      const filePath = await window.api.selectTxtFile();
      selectedFilePath = filePath;
      document.getElementById('upload-status').innerText = filePath ? `选中文件：${filePath}` : '未选择文件';
      if (filePath) {
        const titleInput = document.getElementById('book-title');
        if (!titleInput.value.trim()) {
          titleInput.value = filePath.replace(/^.*\\/, '').replace(/\.[^.]+$/, '');
        }
      }
    };

    document.getElementById('upload-book').onclick = async () => {
      if (!selectedFilePath) {
        document.getElementById('upload-status').innerText = '请先选择 TXT 文件。';
        return;
      }
      const payload = {
        filePath: selectedFilePath,
        title: document.getElementById('book-title').value.trim(),
        author: document.getElementById('book-author').value.trim(),
        description: document.getElementById('book-desc').value.trim(),
        coverImg: document.getElementById('book-cover').value.trim(),
        directoryEntries: document.getElementById('book-directory-entries').value
      };
      const result = await window.api.uploadBook(payload);
      document.getElementById('upload-status').innerText = `上传成功：${result.title}`;
      loadBooks();
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(value) {
      if (!value) {
        return '';
      }
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('zh-CN');
    }

    async function loadBooks() {
      const books = await window.api.getBooks();
      const container = document.getElementById('book-list');
      container.innerHTML = '';
      booksById.clear();
      document.getElementById('book-count').textContent = books.length > 0 ? `共 ${books.length} 本` : '';
      document.getElementById('book-empty').style.display = books.length > 0 ? 'none' : 'block';
      books.forEach((book) => {
        booksById.set(String(book.id), book);
        const card = document.createElement('div');
        card.className = 'book-card';
        const meta = [book.author || '未知作者', book.size, formatDate(book.createdAt)].filter(Boolean).join(' · ');
        const cover = book.coverImg
          ? `<img src="${escapeHtml(book.coverImg)}" alt="封面" onerror="this.remove()" />`
          : '<span class="cover-placeholder">📖</span>';
        card.innerHTML = `
          <div class="book-cover">${cover}</div>
          <div class="book-info">
            <div class="book-title" title="${escapeHtml(book.title)}">${escapeHtml(book.title)}</div>
            <div class="book-meta">${escapeHtml(meta)}</div>
            <div class="book-desc">${escapeHtml(book.description || '暂无简介')}</div>
            <div class="book-actions">
              <button onclick='parseBook(${book.id})'>解析章节</button>
              <button onclick='editBookById(${book.id})'>编辑</button>
              <button class="secondary" onclick='openBookFolder(${book.id})'>打开文件夹</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function openBookFolder(bookId) {
      try {
        await window.api.openBookFolder(bookId);
      } catch (error) {
        alert(error.message || '打开文件夹失败');
      }
    }

    let editingBook = null;

    function updateEditCoverPreview() {
      const preview = document.getElementById('edit-cover-preview');
      const url = document.getElementById('edit-book-cover').value.trim();
      preview.innerHTML = '';
      if (!url) {
        preview.innerHTML = '<span>📖</span>';
        return;
      }
      const img = document.createElement('img');
      img.alt = '封面预览';
      img.src = /^https?:\/\//i.test(url)
        ? `${lastServerUrl || 'http://localhost:3000/'}cover-proxy?url=${encodeURIComponent(url)}`
        : url;
      img.onerror = () => {
        img.remove();
        preview.innerHTML = '<span>⚠️</span>';
      };
      preview.appendChild(img);
    }

    let coverPreviewTimer = null;
    document.getElementById('edit-book-cover').addEventListener('input', () => {
      clearTimeout(coverPreviewTimer);
      coverPreviewTimer = setTimeout(updateEditCoverPreview, 300);
    });

    function showEditModal(book) {
      editingBook = book;
      document.getElementById('edit-book-id').value = book.id;
      document.getElementById('edit-book-title').value = book.title || '';
      document.getElementById('edit-book-author').value = book.author || '';
      document.getElementById('edit-book-description').value = book.description || '';
      document.getElementById('edit-book-cover').value = book.coverImgSource ?? book.coverImg ?? '';
      document.getElementById('edit-book-directory').value = book.directoryEntries || '';
      updateEditCoverPreview();
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function hideEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
      editingBook = null;
      document.getElementById('edit-cover-preview').innerHTML = '<span>📖</span>';
    }

    document.getElementById('cancel-edit').onclick = hideEditModal;
    document.getElementById('close-edit').onclick = hideEditModal;
    document.getElementById('edit-modal').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) {
        hideEditModal();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.getElementById('edit-modal').style.display !== 'none') {
        hideEditModal();
      }
    });
    document.getElementById('save-edit').onclick = async () => {
      if (!editingBook) {
        return;
      }
      await window.api.updateBook({
        id: editingBook.id,
        title: document.getElementById('edit-book-title').value.trim(),
        author: document.getElementById('edit-book-author').value.trim(),
        description: document.getElementById('edit-book-description').value.trim(),
        coverImg: document.getElementById('edit-book-cover').value.trim(),
        directoryEntries: document.getElementById('edit-book-directory').value
      });
      hideEditModal();
      loadBooks();
    };

    async function editBookById(bookId) {
      const book = booksById.get(String(bookId));
      if (!book) {
        return;
      }
      showEditModal(book);
    }

    function chapterPreviewText(content) {
      const text = String(content || '')
        .replace(/<br\s*\/?>\n?/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return text.length > 60 ? `${text.slice(0, 60)}…` : text;
    }

    function chapterPlainText(content) {
      return String(content || '').replace(/<br\s*\/?>\n?/gi, '\n');
    }

    function createChapterItem(chapter, index) {
      const item = document.createElement('div');
      item.className = 'chapter-item';
      const head = document.createElement('div');
      head.className = 'chapter-head';
      head.innerHTML = `
        <span class="chapter-no">${index + 1}</span>
        <span class="chapter-title" title="${escapeHtml(chapter.title)}">${escapeHtml(chapter.title)}</span>
        <span class="chapter-toggle">展开</span>
      `;
      const preview = document.createElement('div');
      preview.className = 'chapter-preview';
      preview.textContent = chapterPreviewText(chapter.content) || '（空章节）';
      const body = document.createElement('div');
      body.className = 'chapter-body';
      const setExpanded = (expanded) => {
        if (expanded && !body.dataset.loaded) {
          body.textContent = chapterPlainText(chapter.content);
          body.dataset.loaded = '1';
        }
        body.style.display = expanded ? 'block' : 'none';
        item.classList.toggle('expanded', expanded);
        head.querySelector('.chapter-toggle').textContent = expanded ? '收起' : '展开';
      };
      item._setExpanded = setExpanded;
      head.addEventListener('click', () => setExpanded(!item.classList.contains('expanded')));
      item.appendChild(head);
      item.appendChild(preview);
      item.appendChild(body);
      return item;
    }

    function renderChapterList(chapters, keyword) {
      const list = document.getElementById('chapter-list');
      if (!list) {
        return;
      }
      list.innerHTML = '';
      const lowerKeyword = keyword.toLowerCase();
      const filtered = chapters
        .map((chapter, index) => ({ chapter, index }))
        .filter(({ chapter }) => !keyword || String(chapter.title || '').toLowerCase().includes(lowerKeyword));
      filtered.forEach(({ chapter, index }) => {
        list.appendChild(createChapterItem(chapter, index));
      });
      const status = document.getElementById('filter-status');
      if (status) {
        status.textContent = keyword ? `匹配 ${filtered.length} / ${chapters.length} 章` : '';
      }
    }

    async function parseBook(bookId) {
      const result = await window.api.parseBook({ bookId });
      document.querySelector('.menu-item[data-target="result-section"]').click();
      const { book, chapters } = result;
      const output = document.getElementById('chapter-output');
      output.innerHTML = '';

      if (!chapters || chapters.length === 0) {
        output.innerHTML = '<div class="parse-empty">未解析出任何章节，请检查解析规则或目录项配置。</div>';
        return;
      }

      const meta = [book.author || '未知作者', `共 ${chapters.length} 章`, book.size].filter(Boolean).join(' · ');
      const header = document.createElement('div');
      header.className = 'parse-header';
      header.innerHTML = `
        <div class="parse-title">${escapeHtml(book.title)}</div>
        <div class="parse-meta">${escapeHtml(meta)}</div>
      `;
      output.appendChild(header);

      const toolbar = document.createElement('div');
      toolbar.className = 'parse-toolbar';
      toolbar.innerHTML = `
        <input id="chapter-filter" placeholder="按章节标题筛选..." />
        <span id="filter-status" class="filter-status"></span>
        <button id="toggle-all-chapters" class="btn-secondary" type="button">全部展开</button>
      `;
      output.appendChild(toolbar);

      const list = document.createElement('div');
      list.className = 'chapter-list';
      list.id = 'chapter-list';
      output.appendChild(list);

      let filterTimer = null;
      let allExpanded = false;
      const toggleAllButton = document.getElementById('toggle-all-chapters');
      document.getElementById('chapter-filter').addEventListener('input', (event) => {
        clearTimeout(filterTimer);
        const keyword = event.target.value.trim();
        filterTimer = setTimeout(() => {
          renderChapterList(chapters, keyword);
          allExpanded = false;
          toggleAllButton.textContent = '全部展开';
        }, 200);
      });
      toggleAllButton.addEventListener('click', (event) => {
        allExpanded = !allExpanded;
        document.querySelectorAll('#chapter-list .chapter-item').forEach((item) => item._setExpanded(allExpanded));
        event.currentTarget.textContent = allExpanded ? '全部收起' : '全部展开';
      });

      renderChapterList(chapters, '');
    }

    async function loadRules() {
      const rules = await window.api.getRules();
      document.getElementById('rule-prefix').value = rules.chapterPrefix;
      document.getElementById('rule-keywords').value = (rules.chapterKeywords || ['章', '回', '节']).join(',');
      document.getElementById('rule-suffixes').value = rules.chapterSuffixes.join(',');
      document.getElementById('rule-max-title-length').value = rules.maxTitleLength;
      document.getElementById('rule-empty-line').checked = !!rules.useEmptyLineAsTitle;
    }

    document.getElementById('save-rules').onclick = async () => {
      const current = await window.api.getRules().catch(() => ({}));
      const rules = Object.assign({}, current, {
        chapterPrefix: document.getElementById('rule-prefix').value.trim() || '第',
        chapterKeywords: document.getElementById('rule-keywords').value.split(',').map((item) => item.trim()).filter(Boolean),
        chapterSuffixes: document.getElementById('rule-suffixes').value.split(',').map((item) => item.trim()).filter(Boolean),
        maxTitleLength: Number(document.getElementById('rule-max-title-length').value) || 30,
        ignorePatterns: ['^\\s*$'],
        useEmptyLineAsTitle: document.getElementById('rule-empty-line').checked
      });
      await window.api.saveRules(rules);
      document.getElementById('server-status').innerText = '解析规则已保存';
    };

    document.getElementById('start-server').onclick = async () => {
      const result = await window.api.startServer();
      lastServerUrl = result.url;
      document.getElementById('server-status').innerText = `HTTP 服务已启动：${result.url}`;
    };

    async function updateServerStatus() {
      try {
        const result = await window.api.startServer();
        lastServerUrl = result.url;
        document.getElementById('server-status').innerText = `HTTP 服务已启动：${result.url}`;
      } catch (err) {
        document.getElementById('server-status').innerText = 'HTTP 服务启动失败';
      }
    }

    updateServerStatus();

    document.getElementById('open-service-page').onclick = async () => {
      if (lastServerUrl) {
        window.api.openUrl(lastServerUrl);
      } else {
        const result = await window.api.startServer();
        lastServerUrl = result.url;
        document.getElementById('server-status').innerText = `HTTP 服务已启动：${result.url}`;
      }
    };

    loadBooks();
    loadRules();
  </script>
</body>
</html>
